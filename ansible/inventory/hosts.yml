---
all:
  vars:
    ansible_ssh_private_key_file: ~/.ssh/id_ed25519_personal_homeserver
    # Always over Tailscale: the host by its MagicDNS name, the containers through it.
    # Full name: the macOS Tailscale daemon does not apply the tailnet search domain.
    tailnet_domain: tail640776.ts.net
  children:
    proxmox:
      hosts:
        pve:
          ansible_host: "{{ tailscale_hostname }}.{{ tailnet_domain }}"
          ansible_user: root
    pihole:
      hosts:
        pihole:
          ansible_host: 192.168.1.60
          ansible_user: root
    caddy:
      hosts:
        caddy:
          ansible_host: 192.168.1.64
          ansible_user: root
    gatus:
      hosts:
        gatus:
          ansible_host: 192.168.1.61
          ansible_user: root
    media:
      hosts:
        media:
          ansible_host: 192.168.1.63
          ansible_user: root
    bidsenseai_extractor:
      hosts:
        bidsenseai-extractor:
          ansible_host: 192.168.1.80
          ansible_user: root
    hiresignalai:
      hosts:
        hiresignalai:
          ansible_host: 192.168.1.81
          ansible_user: root
    lxc:
      vars:
        ansible_ssh_common_args: >-
          {% set jump = hostvars[groups['proxmox'] | first] %}
          -o "ProxyCommand=ssh -i {{ ansible_ssh_private_key_file }}
          -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=accept-new
          -W %h:%p {{ jump.ansible_user }}@{{ jump.ansible_host }}"
      children:
        pihole:
        caddy:
        gatus:
        media:
        bidsenseai_extractor:
        hiresignalai:
