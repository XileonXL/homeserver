---
# Joins the tailnet as a plain node (needs /dev/net/tun in the container) and
# answers the local domain over it, so the names work away from home.
tailscale_hostname: caddy
tailscale_accept_dns: false
tailscale_advertise_tags:
  - tag:homeserver

caddy_dashboard_name: homeserver.lan
tailnet_dns_domain: "{{ caddy_dashboard_name }}"

caddy_sites:
  - name: pve.homeserver.lan
    title: Proxmox
    icon: fas fa-server
    upstream: https://192.168.1.50:8006
    upstream_tls_insecure: true
  - name: pihole.homeserver.lan
    title: Pi-hole
    icon: fas fa-shield-halved
    upstream: http://192.168.1.60:80
  - name: status.homeserver.lan
    title: Status
    icon: fas fa-heart-pulse
    upstream: http://192.168.1.61:8080
  - name: jellyfin.homeserver.lan
    title: Jellyfin
    icon: fas fa-film
    upstream: http://192.168.1.63:8096
  - name: torrent.homeserver.lan
    title: Downloads
    icon: fas fa-download
    upstream: http://192.168.1.63:8080
  - name: prowlarr.homeserver.lan
    title: Search
    icon: fas fa-magnifying-glass
    upstream: http://192.168.1.63:9696
