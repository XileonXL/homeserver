---
proxmox_domain_name: homeserver.lan

# Name in the tailnet; Ansible and OpenTofu reach the host by it.
tailscale_hostname: pve

# Subnet router: advertise the whole LAN. Route approval is done in the
# Tailscale admin console.
tailscale_advertise_routes:
  - 192.168.1.0/24

haos_network_address: 192.168.1.62/24
haos_network_gateway: 192.168.1.1
haos_network_dns:
  - 192.168.1.60
haos_network_trusted_proxies:
  - 192.168.1.64

# Devices passed to containers; the guest IDs are in opentofu/envs/homeserver/variables.tf.
# Caddy runs a Tailscale client (kernel networking); Jellyfin transcodes on the GPU.
lxc_devices_guests:
  164:
    - path: /dev/net/tun
  163:
    - path: /dev/dri/renderD128
      group: render
