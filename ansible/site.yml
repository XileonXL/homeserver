---
- name: Configure Proxmox host
  hosts: proxmox
  gather_facts: true

  roles:
    - role: tailscale
    - role: proxmox_terraform

- name: Configure Pi-hole
  hosts: pihole
  gather_facts: false

  # A fresh Debian LXC template may have no Python (or python3-apt), which
  # Ansible modules need. raw works without it.
  pre_tasks:
    - name: Check for python3 with the apt bindings
      ansible.builtin.raw: python3 -c 'import apt'
      register: pihole_python_check
      changed_when: false
      failed_when: false
      check_mode: false

    - name: Install python3 and python3-apt
      ansible.builtin.raw: apt-get update -qq && apt-get install -y -qq python3 python3-apt
      changed_when: true
      when: pihole_python_check.rc != 0

    - name: Gather facts
      ansible.builtin.setup:

  roles:
    - role: pihole
