---
- name: Reload systemd
  ansible.builtin.systemd:
    daemon_reload: true

# Mount points are not hot-plugged: pct keeps the change pending until the
# container is started again, and reboot applies pending changes.
- name: Reboot the media container
  ansible.builtin.command:
    argv:
      - pct
      - reboot
      - "{{ media_disk_guest_id }}"
  changed_when: true
  when: "media_disk_ct_status.stdout | trim == 'status: running'"
