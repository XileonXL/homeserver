---
flaresolverr_version: 3.5.2
flaresolverr_download_url: >-
  https://github.com/FlareSolverr/FlareSolverr/releases/download/v{{ flaresolverr_version }}/flaresolverr_linux_x64.tar.gz

flaresolverr_install_dir: /opt/flaresolverr
# Home of the service user. The browser driver is downloaded here on first use.
flaresolverr_data_dir: /var/lib/flaresolverr
flaresolverr_user: flaresolverr

# There is no authentication, so it only listens where its client runs.
flaresolverr_host: 127.0.0.1
flaresolverr_port: 8191

# The release bundles its own browser but not the shared libraries it links to.
# The distribution's chromium package is installed only to pull those in.
flaresolverr_packages:
  - ca-certificates
  - tar
  - xvfb
  - xauth
  - chromium
