---
- name: Check whether the media disk is mounted
  ansible.builtin.command:
    argv:
      - findmnt
      - --noheadings
      - --mountpoint
      - "{{ jellyfin_media_path }}"
  register: jellyfin_findmnt
  changed_when: false
  failed_when: jellyfin_findmnt.rc not in [0, 1]
  check_mode: false

- name: Assert the media disk is mounted
  ansible.builtin.assert:
    that: jellyfin_findmnt.rc == 0
    fail_msg: >-
      {{ jellyfin_media_path }} is not a mount point, so the libraries would be
      created on the container's root disk. Run the proxmox play with the media
      disk attached (the container must exist) and try again.
    quiet: true

- name: Create the shared media group
  ansible.builtin.group:
    name: "{{ jellyfin_media_group }}"
    gid: "{{ jellyfin_media_gid }}"
    system: true
  register: jellyfin_group

- name: Gather package facts
  ansible.builtin.package_facts:
    manager: apt

- name: Install repository prerequisites
  ansible.builtin.apt:
    name:
      - ca-certificates
      - python3-debian # required by deb822_repository
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Add the Jellyfin apt repository
  ansible.builtin.deb822_repository:
    name: jellyfin
    types: deb
    uris: "{{ jellyfin_repo_url }}"
    suites: "{{ jellyfin_repo_suite }}"
    components: main
    signed_by: "{{ jellyfin_repo_key_url }}"
    state: present
  register: jellyfin_repo

- name: Install Jellyfin
  ansible.builtin.apt:
    name: jellyfin
    state: present
    update_cache: "{{ jellyfin_repo is changed }}"
  # In check mode the repository above is not really added, so the package is unknown.
  when: not (ansible_check_mode and jellyfin_repo is changed)

# The jellyfin user is created by the package, and the group by the task above.
- name: Configure and run Jellyfin
  when: >-
    not ansible_check_mode
    or ('jellyfin' in ansible_facts['packages'] and jellyfin_group is not changed)
  block:
    - name: Check the render device
      when: jellyfin_hwaccel | bool
      block:
        - name: Check the render device in the container
          ansible.builtin.stat:
            path: "{{ jellyfin_hwaccel_device }}"
          register: jellyfin_hwaccel_stat

        # In check mode the device may be pending a reboot of the container.
        - name: Assert the render device exists
          ansible.builtin.assert:
            that: jellyfin_hwaccel_stat.stat.exists
            fail_msg: >-
              {{ jellyfin_hwaccel_device }} does not exist in the container. Run the
              proxmox play (lxc_devices) with the GPU present and the container
              running, then try again.
            quiet: true
          when: not ansible_check_mode

    # The render group owns the GPU render node inside the container.
    - name: Add the jellyfin user to its groups
      ansible.builtin.user:
        name: jellyfin
        groups: "{{ [jellyfin_media_group] + (['render'] if jellyfin_hwaccel | bool else []) }}"
        append: true
      notify: Restart jellyfin

    - name: Configure hardware transcoding
      when: jellyfin_hwaccel | bool
      block:
        # Jellyfin writes the whole file back whenever settings are saved, so only
        # the elements this role owns are edited; a template would fight it. A
        # missing file is created first with those elements.
        - name: Create the encoding configuration if missing
          ansible.builtin.template:
            src: encoding.xml.j2
            dest: "{{ jellyfin_encoding_config }}"
            owner: jellyfin
            group: jellyfin
            mode: "0644"
            force: false
          register: jellyfin_encoding_created
          notify: Restart jellyfin

        - name: Set the hardware acceleration options
          ansible.builtin.replace:
            path: "{{ jellyfin_encoding_config }}"
            regexp: '<{{ item.key }}>[^<]*</{{ item.key }}>|<{{ item.key }}\s*/>'
            replace: "<{{ item.key }}>{{ item.value }}</{{ item.key }}>"
          loop: "{{ jellyfin_encoding_options | dict2items }}"
          notify: Restart jellyfin
          when: jellyfin_encoding_created is not changed

        - name: Set the hardware decoding codecs
          ansible.builtin.replace:
            path: "{{ jellyfin_encoding_config }}"
            regexp: '(?s)^[ \t]*<HardwareDecodingCodecs\s*/>|^[ \t]*<HardwareDecodingCodecs>.*?</HardwareDecodingCodecs>'
            replace: "  {{ lookup('ansible.builtin.template', 'decoding_codecs.xml.j2') | trim }}"
          notify: Restart jellyfin
          when: jellyfin_encoding_created is not changed

    - name: Create the library directories
      ansible.builtin.file:
        path: "{{ jellyfin_media_path }}/{{ item }}"
        state: directory
        owner: root
        group: "{{ jellyfin_media_group }}"
        mode: "2775"
      loop: "{{ jellyfin_library_dirs }}"

    - name: Enable and start Jellyfin
      ansible.builtin.service:
        name: jellyfin
        state: started
        enabled: true
