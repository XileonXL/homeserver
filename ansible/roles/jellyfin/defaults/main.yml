---
# Official Jellyfin apt repository; the suite is the Debian release name.
jellyfin_repo_url: https://repo.jellyfin.org/debian
jellyfin_repo_suite: "{{ ansible_facts['distribution_release'] }}"
jellyfin_repo_key_url: https://repo.jellyfin.org/jellyfin_team.gpg.key

# Group shared by Jellyfin and the torrent client, so that downloads are readable
# by Jellyfin. The gid is fixed so that it is the same on every install.
jellyfin_media_group: media
jellyfin_media_gid: 1100

# Where the media disk appears inside the container (see media_disk).
jellyfin_media_path: /media

# Library directories under the media path; add them as libraries in the web UI.
jellyfin_library_dirs:
  - movies
  - shows

# Hardware transcoding through the host GPU (VAAPI). Needs the render node passed to
# the container (see lxc_devices), so it is off unless a site turns it on. Jellyfin's
# own ffmpeg bundles the Intel media driver.
jellyfin_hwaccel: false
jellyfin_hwaccel_device: /dev/dri/renderD128

# Codecs the GPU decodes; encoding is H.264 and HEVC.
jellyfin_hwaccel_decode_codecs:
  - h264
  - hevc
  - mpeg2video
  - vc1
  - vp8
  - vp9

# Jellyfin's encoding configuration.
jellyfin_encoding_config: /etc/jellyfin/encoding.xml

# Elements of encoding.xml this role manages. Intel low-power encoders stay off: on
# the GPU generations this targets they need GuC/HuC firmware.
jellyfin_encoding_options:
  HardwareAccelerationType: vaapi
  VaapiDevice: "{{ jellyfin_hwaccel_device }}"
  EnableHardwareEncoding: "true"
  AllowHevcEncoding: "true"
  EnableDecodingColorDepth10Hevc: "true"
  EnableDecodingColorDepth10Vp9: "true"
  EnableIntelLowPowerH264HwEncoder: "false"
  EnableIntelLowPowerHevcHwEncoder: "false"
