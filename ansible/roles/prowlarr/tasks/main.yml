---
- name: Install Prowlarr dependencies
  ansible.builtin.apt:
    name:
      - ca-certificates
      - curl
      - sqlite3
      - tar
      - "{{ prowlarr_libicu_package }}"
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Create the prowlarr system user
  ansible.builtin.user:
    name: "{{ prowlarr_user }}"
    system: true
    shell: /usr/sbin/nologin
    home: "{{ prowlarr_data_dir }}"
    create_home: false
  register: prowlarr_user_result

# The user does not exist in check mode on a fresh host, so everything that
# names it as an owner is skipped there.
- name: Work out whether the service user exists
  ansible.builtin.set_fact:
    prowlarr_ready: "{{ not (ansible_check_mode and prowlarr_user_result is changed) }}"

- name: Install and run Prowlarr
  when: prowlarr_ready | bool
  block:
    - name: Create the data directory
      ansible.builtin.file:
        path: "{{ prowlarr_data_dir }}"
        state: directory
        owner: "{{ prowlarr_user }}"
        group: "{{ prowlarr_user }}"
        mode: "0750"

    - name: Check for the version marker
      ansible.builtin.stat:
        path: "{{ prowlarr_version_file }}"
      register: prowlarr_version_stat

    - name: Read the installed version
      ansible.builtin.slurp:
        src: "{{ prowlarr_version_file }}"
      register: prowlarr_version_slurp
      when: prowlarr_version_stat.stat.exists

    - name: Set the installed version
      ansible.builtin.set_fact:
        prowlarr_installed_version: >-
          {{ (prowlarr_version_slurp.content | b64decode | trim) if prowlarr_version_stat.stat.exists else '' }}

    - name: Replace the program directory
      when:
        - not ansible_check_mode
        - prowlarr_installed_version != prowlarr_version
      block:
        - name: Remove the previous program directory
          ansible.builtin.file:
            path: "{{ prowlarr_install_dir }}"
            state: absent

        - name: Create the program directory
          ansible.builtin.file:
            path: "{{ prowlarr_install_dir }}"
            state: directory
            owner: root
            group: root
            mode: "0755"

        # The archive has one top-level directory, which is stripped.
        - name: Download and unpack Prowlarr
          ansible.builtin.unarchive:
            src: "{{ prowlarr_download_url }}"
            dest: "{{ prowlarr_install_dir }}"
            remote_src: true
            owner: root
            group: root
            extra_opts:
              - --strip-components=1
          notify: Restart prowlarr

        - name: Check for the Prowlarr executable
          ansible.builtin.stat:
            path: "{{ prowlarr_install_dir }}/Prowlarr"
          register: prowlarr_binary_stat

        - name: Assert the archive had the expected layout
          ansible.builtin.assert:
            that:
              - prowlarr_binary_stat.stat.exists
              - prowlarr_binary_stat.stat.xusr
            fail_msg: >-
              {{ prowlarr_install_dir }}/Prowlarr is missing or not executable after
              unpacking {{ prowlarr_download_url }}.
            quiet: true

        # Written last: a failed install leaves no marker and is retried.
        - name: Record the installed version
          ansible.builtin.copy:
            content: "{{ prowlarr_version }}\n"
            dest: "{{ prowlarr_version_file }}"
            owner: root
            group: root
            mode: "0644"

    # After the program and its directories exist: the restart this triggers would
    # fail on a host where they are still missing.
    - name: Install the systemd unit
      ansible.builtin.template:
        src: prowlarr.service.j2
        dest: /etc/systemd/system/prowlarr.service
        owner: root
        group: root
        mode: "0644"
      notify:
        - Reload systemd
        - Restart prowlarr

    - name: Load the unit and apply pending restarts now
      ansible.builtin.meta: flush_handlers
      when: not ansible_check_mode

    - name: Enable and start Prowlarr
      ansible.builtin.service:
        name: prowlarr
        state: started
        enabled: true
      # In check mode on a fresh host the unit has not been written.
      when: not ansible_check_mode

# Prowlarr keeps these settings in its database, so they are set through the API.
- name: Configure Prowlarr through its API
  when:
    - prowlarr_ready | bool
    - prowlarr_flaresolverr_url | length > 0 or prowlarr_jackett_indexers | length > 0
  block:
    # Prowlarr writes config.xml, with its API key, on the first start.
    - name: Wait for Prowlarr to listen
      ansible.builtin.wait_for:
        port: "{{ prowlarr_port }}"
        timeout: 120
      when: not ansible_check_mode

    - name: Check for the Prowlarr configuration file
      ansible.builtin.stat:
        path: "{{ prowlarr_data_dir }}/config.xml"
      register: prowlarr_config_stat

    - name: Read the Prowlarr configuration file
      ansible.builtin.slurp:
        src: "{{ prowlarr_data_dir }}/config.xml"
      register: prowlarr_config_slurp
      no_log: true
      when: prowlarr_config_stat.stat.exists

    # Indexers are added by hand; give one the tag to send it through FlareSolverr.
    - name: Set the FlareSolverr proxy
      when:
        - prowlarr_config_stat.stat.exists
        - prowlarr_flaresolverr_url | length > 0
      vars:
        prowlarr_tag_existing: >-
          {{ prowlarr_tags.json | selectattr('label', 'equalto', prowlarr_flaresolverr_tag) | list }}
      block:
        - name: Read the tags
          ansible.builtin.uri:
            url: "{{ prowlarr_api_url }}/tag"
            headers:
              X-Api-Key: "{{ prowlarr_api_key }}"
            return_content: true
          register: prowlarr_tags
          check_mode: false
          no_log: true

        - name: Create the FlareSolverr tag
          ansible.builtin.uri:
            url: "{{ prowlarr_api_url }}/tag"
            method: POST
            headers:
              X-Api-Key: "{{ prowlarr_api_key }}"
            body_format: json
            body:
              label: "{{ prowlarr_flaresolverr_tag }}"
            status_code: [200, 201]
          register: prowlarr_tag_created
          changed_when: true
          no_log: true
          when: prowlarr_tag_existing | length == 0

        - name: Read the indexer proxies
          ansible.builtin.uri:
            url: "{{ prowlarr_api_url }}/indexerproxy"
            headers:
              X-Api-Key: "{{ prowlarr_api_key }}"
            return_content: true
          register: prowlarr_proxies
          check_mode: false
          no_log: true

        - name: Create or update the FlareSolverr proxy
          ansible.builtin.uri:
            url: "{{ prowlarr_api_url }}/indexerproxy{{ '/' ~ prowlarr_proxy_existing[0].id if prowlarr_proxy_existing else '' }}"
            method: "{{ 'PUT' if prowlarr_proxy_existing else 'POST' }}"
            headers:
              X-Api-Key: "{{ prowlarr_api_key }}"
            body_format: json
            body: "{{ prowlarr_proxy_existing[0] | default({}) | combine(prowlarr_proxy_desired) }}"
            status_code: [200, 201, 202]
          changed_when: true
          no_log: true
          when: >-
            prowlarr_proxy_existing | length == 0
            or prowlarr_proxy_existing[0].tags != prowlarr_proxy_desired.tags
            or (prowlarr_proxy_existing[0].fields | selectattr('name', 'equalto', 'host')
                | map(attribute='value') | first) != prowlarr_flaresolverr_url
          vars:
            prowlarr_proxy_existing: >-
              {{ prowlarr_proxies.json | selectattr('implementation', 'equalto', 'FlareSolverr') | list }}
            prowlarr_proxy_desired:
              name: FlareSolverr
              implementation: FlareSolverr
              configContract: FlareSolverrSettings
              fields:
                - name: host
                  value: "{{ prowlarr_flaresolverr_url }}"
                - name: requestTimeout
                  value: 60
              tags:
                - "{{ (prowlarr_tag_existing | first | default(prowlarr_tag_created.json | default({}))).id | default(0) }}"

    - name: Check for the Jackett configuration file
      ansible.builtin.stat:
        path: "{{ prowlarr_jackett_config_file }}"
      register: prowlarr_jackett_stat
      when: prowlarr_jackett_indexers | length > 0

    - name: Add the Jackett indexers
      when:
        - prowlarr_config_stat.stat.exists
        - prowlarr_jackett_indexers | length > 0
        - prowlarr_jackett_stat.stat.exists
      block:
        - name: Read the Jackett configuration file
          ansible.builtin.slurp:
            src: "{{ prowlarr_jackett_config_file }}"
          register: prowlarr_jackett_slurp
          no_log: true

        - name: Read the indexers
          ansible.builtin.uri:
            url: "{{ prowlarr_api_url }}/indexer"
            headers:
              X-Api-Key: "{{ prowlarr_api_key }}"
            return_content: true
          register: prowlarr_indexers
          check_mode: false
          no_log: true

        # 1 is the application profile every installation starts with. Prowlarr
        # searches the site before it accepts the indexer, which can take a while
        # and fails while the site is unreachable.
        - name: Add a Torznab indexer for each Jackett indexer
          ansible.builtin.uri:
            url: "{{ prowlarr_api_url }}/indexer"
            timeout: 180
            method: POST
            headers:
              X-Api-Key: "{{ prowlarr_api_key }}"
            body_format: json
            body:
              name: "{{ item }} (Jackett)"
              implementation: Torznab
              configContract: TorznabSettings
              protocol: torrent
              enable: true
              appProfileId: 1
              priority: 25
              fields:
                - name: baseUrl
                  value: "{{ prowlarr_jackett_feed }}"
                - name: apiPath
                  value: /api
                - name: apiKey
                  value: "{{ (prowlarr_jackett_slurp.content | b64decode | from_json).APIKey }}"
            status_code: [200, 201]
          changed_when: true
          no_log: true
          loop: "{{ prowlarr_jackett_indexers }}"
          when: >-
            prowlarr_jackett_feed not in (prowlarr_indexers.json | map(attribute='fields') | flatten
              | selectattr('name', 'equalto', 'baseUrl') | map(attribute='value') | list)
          vars:
            prowlarr_jackett_feed: "{{ prowlarr_jackett_url }}/api/v2.0/indexers/{{ item }}/results/torznab/"
