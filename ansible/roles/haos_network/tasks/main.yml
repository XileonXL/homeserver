---
# The guest agent only answers while the VM runs. A VM that is powered off on
# purpose is skipped; its settings are stored on its disk and survive.
- name: Read the state of the Home Assistant OS VM
  ansible.builtin.command:
    argv: [qm, status, "{{ haos_network_vm_id }}"]
  register: haos_network_vm_status
  changed_when: false
  failed_when: false
  check_mode: false

- name: Set a static address on Home Assistant OS
  when:
    - haos_network_address | length > 0
    - "'status: running' in haos_network_vm_status.stdout"
  block:
    - name: Find the wired connection inside the guest
      ansible.builtin.command:
        argv:
          - qm
          - guest
          - exec
          - "{{ haos_network_vm_id }}"
          - --
          - nmcli
          - --terse
          - --fields
          - NAME,TYPE
          - connection
          - show
          - --active
      register: haos_network_connections
      changed_when: false
      check_mode: false

    - name: Pick the wired connection
      ansible.builtin.set_fact:
        haos_network_connection: >-
          {{ (haos_network_connections.stdout | from_json)['out-data'] | default('')
             | regex_findall('(?m)^(.+):802-3-ethernet$') | first | default('', true) }}

    - name: Assert a wired connection was found
      ansible.builtin.assert:
        that: haos_network_connection != ''
        fail_msg: >-
          No active wired connection reported by the guest agent of VM
          {{ haos_network_vm_id }}. Is Home Assistant OS running?
        quiet: true

    - name: Read the current IPv4 settings
      ansible.builtin.command:
        argv:
          - qm
          - guest
          - exec
          - "{{ haos_network_vm_id }}"
          - --
          - nmcli
          - --get-values
          - ipv4.method,ipv4.addresses,ipv4.gateway,ipv4.dns
          - connection
          - show
          - "{{ haos_network_connection }}"
      register: haos_network_current
      changed_when: false
      check_mode: false

    - name: Apply the static IPv4 settings
      ansible.builtin.command:
        argv:
          - qm
          - guest
          - exec
          - "{{ haos_network_vm_id }}"
          - --
          - nmcli
          - connection
          - modify
          - "{{ haos_network_connection }}"
          - ipv4.method
          - manual
          - ipv4.addresses
          - "{{ haos_network_address }}"
          - ipv4.gateway
          - "{{ haos_network_gateway }}"
          - ipv4.dns
          - "{{ haos_network_dns | join(',') }}"
      register: haos_network_modify
      changed_when: true
      notify: Bring the Home Assistant OS connection up
      failed_when: haos_network_modify.rc != 0 or (haos_network_modify.stdout | from_json).exitcode != 0
      when: haos_network_observed != haos_network_desired
      vars:
        haos_network_desired:
          - manual
          - "{{ haos_network_address }}"
          - "{{ haos_network_gateway }}"
          - "{{ haos_network_dns | join(',') }}"
        haos_network_observed: >-
          {{ ((haos_network_current.stdout | from_json)['out-data'] | default('')).splitlines()
             | map('trim') | list }}

- name: Trust the reverse proxies in Home Assistant
  when:
    - haos_network_trusted_proxies | length > 0
    - "'status: running' in haos_network_vm_status.stdout"
  block:
    - name: Read the stored HTTP settings from the guest
      ansible.builtin.command:
        argv:
          - qm
          - guest
          - exec
          - "{{ haos_network_vm_id }}"
          - --
          - cat
          - "{{ haos_network_http_store }}"
      register: haos_network_http_raw
      changed_when: false
      check_mode: false

    - name: Parse the stored HTTP settings
      ansible.builtin.set_fact:
        haos_network_http: "{{ (haos_network_http_raw.stdout | from_json)['out-data'] | from_json }}"

    # The file is internal to Home Assistant; refuse to edit a layout not seen before.
    - name: Assert the storage layout is the known one
      ansible.builtin.assert:
        that:
          - haos_network_http.key == 'http'
          - haos_network_http.version == 2
          - haos_network_http.data.stable is mapping
        fail_msg: >-
          Unexpected layout in {{ haos_network_http_store }}. Set the trusted proxies
          in Home Assistant's own network settings instead.
        quiet: true

    - name: Write the trusted proxies while the core is stopped
      when: >-
        not (haos_network_http.data.stable.use_x_forwarded_for | default(false))
        or (haos_network_http.data.stable.trusted_proxies | default([]) | sort)
           != (haos_network_trusted_proxies | sort)
      vars:
        haos_network_http_new: >-
          {{ haos_network_http | combine({'data': {'stable': {
               'use_x_forwarded_for': true,
               'trusted_proxies': haos_network_trusted_proxies}}}, recursive=true) }}
      block:
        - name: Stop the Home Assistant core
          ansible.builtin.command:
            argv: [qm, guest, exec, "{{ haos_network_vm_id }}", --timeout, "180", --, ha, core, stop]
          changed_when: true

        - name: Write the HTTP settings
          ansible.builtin.command:
            argv:
              - qm
              - guest
              - exec
              - "{{ haos_network_vm_id }}"
              - --pass-stdin
              - "1"
              - --
              - tee
              - "{{ haos_network_http_store }}"
            stdin: "{{ haos_network_http_new | to_nice_json }}"
          changed_when: true

        - name: Start the Home Assistant core
          ansible.builtin.command:
            argv: [qm, guest, exec, "{{ haos_network_vm_id }}", --timeout, "180", --, ha, core, start]
          changed_when: true
