---
- name: Fail without the secrets and files from .env
  ansible.builtin.assert:
    that:
      - bidsenseai_extractor_deploy_key_file | length > 0
      - bidsenseai_extractor_cert_file | length > 0
      - bidsenseai_extractor_key_file | length > 0
      - bidsenseai_extractor_trust_anchor_arn | length > 0
      - bidsenseai_extractor_profile_arn | length > 0
      - bidsenseai_extractor_role_arn | length > 0
      - bidsenseai_extractor_db_cluster_arn | length > 0
      - bidsenseai_extractor_db_secret_arn | length > 0
      - bidsenseai_extractor_db_name | length > 0
      - bidsenseai_extractor_documents_bucket | length > 0
      - bidsenseai_extractor_oauth_token | length > 0
      - bidsenseai_extractor_telegram_bot_token | length > 0
      - bidsenseai_extractor_telegram_chat_id | length > 0
    fail_msg: >-
      An EXTRACTOR_* variable, CLAUDE_CODE_OAUTH_TOKEN, TELEGRAM_BOT_TOKEN or
      TELEGRAM_CHAT_ID is empty. Fill in .env (see .env.example) and load it.
    quiet: true
  when: not ansible_check_mode

- name: Install packages
  ansible.builtin.apt:
    name:
      - acl
      - ca-certificates
      - curl
      - git
      - openssh-client
      - rsync
      - sudo
      - tzdata
      - xz-utils
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Create the extractor system user
  ansible.builtin.user:
    name: "{{ bidsenseai_extractor_user }}"
    system: true
    shell: /usr/sbin/nologin
    home: "{{ bidsenseai_extractor_home }}"
    create_home: true
  register: bidsenseai_extractor_user_result

- name: Create the program directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  loop:
    - /opt/uv/{{ bidsenseai_extractor_uv_version }}
    - /opt/claude/{{ bidsenseai_extractor_claude_version }}
    - /opt/node/{{ bidsenseai_extractor_node_version }}

- name: Download uv
  ansible.builtin.get_url:
    url: "https://github.com/astral-sh/uv/releases/download/{{ bidsenseai_extractor_uv_version }}/uv-x86_64-unknown-linux-gnu.tar.gz"
    dest: /opt/uv/{{ bidsenseai_extractor_uv_version }}.tar.gz
    checksum: "sha256:{{ bidsenseai_extractor_uv_checksum }}"
    owner: root
    group: root
    mode: "0644"

# The archive has one top-level directory, which is stripped.
- name: Unpack uv
  ansible.builtin.unarchive:
    src: /opt/uv/{{ bidsenseai_extractor_uv_version }}.tar.gz
    dest: /opt/uv/{{ bidsenseai_extractor_uv_version }}
    remote_src: true
    owner: root
    group: root
    extra_opts:
      - --strip-components=1
    creates: /opt/uv/{{ bidsenseai_extractor_uv_version }}/uv
  when: not ansible_check_mode

- name: Link uv into the path
  ansible.builtin.file:
    src: /opt/uv/{{ bidsenseai_extractor_uv_version }}/uv
    dest: /usr/local/bin/uv
    state: link

- name: Download Node.js
  ansible.builtin.get_url:
    url: "https://nodejs.org/dist/v{{ bidsenseai_extractor_node_version }}/node-v{{ bidsenseai_extractor_node_version }}-linux-x64.tar.xz"
    dest: /opt/node/{{ bidsenseai_extractor_node_version }}.tar.xz
    checksum: "sha256:{{ bidsenseai_extractor_node_checksum }}"
    owner: root
    group: root
    mode: "0644"

# The archive has one top-level directory, which is stripped.
- name: Unpack Node.js
  ansible.builtin.unarchive:
    src: /opt/node/{{ bidsenseai_extractor_node_version }}.tar.xz
    dest: /opt/node/{{ bidsenseai_extractor_node_version }}
    remote_src: true
    owner: root
    group: root
    extra_opts:
      - --strip-components=1
    creates: /opt/node/{{ bidsenseai_extractor_node_version }}/bin/node
  when: not ansible_check_mode

- name: Link Node.js into the path
  ansible.builtin.file:
    src: /opt/node/{{ bidsenseai_extractor_node_version }}/bin/{{ item }}
    dest: /usr/local/bin/{{ item }}
    state: link
  loop:
    - node
    - npm
    - npx

- name: Download Claude Code
  ansible.builtin.get_url:
    url: "https://downloads.claude.ai/claude-code-releases/{{ bidsenseai_extractor_claude_version }}/linux-x64/claude"
    dest: /opt/claude/{{ bidsenseai_extractor_claude_version }}/claude
    checksum: "sha256:{{ bidsenseai_extractor_claude_checksum }}"
    owner: root
    group: root
    mode: "0755"

- name: Link Claude Code into the path
  ansible.builtin.file:
    src: /opt/claude/{{ bidsenseai_extractor_claude_version }}/claude
    dest: /usr/local/bin/claude
    state: link

- name: Install aws_signing_helper
  ansible.builtin.get_url:
    url: "https://rolesanywhere.amazonaws.com/releases/{{ bidsenseai_extractor_signing_helper_version }}/X86_64/Linux/Amzn2023/aws_signing_helper"
    dest: /usr/local/bin/aws_signing_helper
    checksum: "sha256:{{ bidsenseai_extractor_signing_helper_checksum }}"
    owner: root
    group: root
    mode: "0755"

- name: Create the configuration directory
  ansible.builtin.file:
    path: "{{ bidsenseai_extractor_config_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Write the alert credentials
  ansible.builtin.template:
    src: alerts.env.j2
    dest: "{{ bidsenseai_extractor_config_dir }}/alerts.env"
    owner: root
    group: root
    mode: "0600"
  no_log: true

- name: Install the web build script
  ansible.builtin.copy:
    src: bidsenseai-extractor-web
    dest: /usr/local/sbin/bidsenseai-extractor-web
    owner: root
    group: root
    mode: "0755"

- name: Install the alert script
  ansible.builtin.copy:
    src: bidsenseai-extractor-alert
    dest: /usr/local/sbin/bidsenseai-extractor-alert
    owner: root
    group: root
    mode: "0755"

- name: Write the environment file
  ansible.builtin.template:
    src: env.j2
    dest: "{{ bidsenseai_extractor_config_dir }}/env"
    owner: root
    group: root
    mode: "0600"
  no_log: true

# The user does not exist in check mode on a fresh host, so everything that
# names it as an owner is skipped there.
- name: Set up the extractor user's files, repository and environment
  when: not (ansible_check_mode and bidsenseai_extractor_user_result is changed)
  block:
    - name: Deploy the certificate and key
      ansible.builtin.copy:
        src: "{{ item.src }}"
        dest: "{{ bidsenseai_extractor_config_dir }}/{{ item.dest }}"
        owner: "{{ bidsenseai_extractor_user }}"
        group: "{{ bidsenseai_extractor_user }}"
        mode: "0600"
      loop:
        - { src: "{{ bidsenseai_extractor_cert_file }}", dest: extractor.pem }
        - { src: "{{ bidsenseai_extractor_key_file }}", dest: extractor.key }
      loop_control:
        label: "{{ item.dest }}"
      no_log: true
      when: not ansible_check_mode

    - name: Create the user's directories
      ansible.builtin.file:
        path: "{{ bidsenseai_extractor_home }}/{{ item.path }}"
        state: directory
        owner: "{{ bidsenseai_extractor_user }}"
        group: "{{ bidsenseai_extractor_user }}"
        mode: "{{ item.mode }}"
      loop:
        - { path: .ssh, mode: "0700" }
        - { path: .aws, mode: "0700" }
        - { path: .cache, mode: "0700" }

    - name: Deploy the GitHub deploy key
      ansible.builtin.copy:
        src: "{{ bidsenseai_extractor_deploy_key_file }}"
        dest: "{{ bidsenseai_extractor_home }}/.ssh/deploy_key"
        owner: "{{ bidsenseai_extractor_user }}"
        group: "{{ bidsenseai_extractor_user }}"
        mode: "0600"
      no_log: true
      when: not ansible_check_mode

    - name: Pin the GitHub host key
      ansible.builtin.copy:
        content: "{{ bidsenseai_extractor_github_host_key | trim }}\n"
        dest: "{{ bidsenseai_extractor_home }}/.ssh/known_hosts"
        owner: "{{ bidsenseai_extractor_user }}"
        group: "{{ bidsenseai_extractor_user }}"
        mode: "0644"

    - name: Write the AWS profile
      ansible.builtin.template:
        src: aws-config.j2
        dest: "{{ bidsenseai_extractor_home }}/.aws/config"
        owner: "{{ bidsenseai_extractor_user }}"
        group: "{{ bidsenseai_extractor_user }}"
        mode: "0600"

    - name: Check out the repository
      ansible.builtin.git:
        repo: "{{ bidsenseai_extractor_repo_url }}"
        dest: "{{ bidsenseai_extractor_repo_dir }}"
        version: "{{ bidsenseai_extractor_repo_ref }}"
        key_file: "{{ bidsenseai_extractor_home }}/.ssh/deploy_key"
        ssh_opts: >-
          -o BatchMode=yes
          -o StrictHostKeyChecking=yes
          -o UserKnownHostsFile={{ bidsenseai_extractor_home }}/.ssh/known_hosts
          -o IdentitiesOnly=yes
      become: true
      become_user: "{{ bidsenseai_extractor_user }}"

    # uv reports "Installed" or "Uninstalled" only when the environment changes.
    - name: Install the doc-extractor and adjudication-model dependencies
      ansible.builtin.command:
        argv:
          - /usr/local/bin/uv
          - sync
          - --frozen
          - --no-dev
          - --python
          - "{{ bidsenseai_extractor_python_version }}"
          - --package
          - doc-extractor
          - --package
          - adjudication-model
      args:
        chdir: "{{ bidsenseai_extractor_repo_dir }}"
      environment:
        HOME: "{{ bidsenseai_extractor_home }}"
      become: true
      become_user: "{{ bidsenseai_extractor_user }}"
      register: bidsenseai_extractor_sync
      changed_when: "'Installed' in bidsenseai_extractor_sync.stderr or 'Uninstalled' in bidsenseai_extractor_sync.stderr"

    # Idempotent: the key is generated once and kept.
    - name: Generate the web deploy key
      ansible.builtin.user:
        name: "{{ bidsenseai_extractor_user }}"
        generate_ssh_key: true
        ssh_key_type: ed25519
        ssh_key_file: .ssh/web_deploy_key
        ssh_key_comment: bidsenseai-extractor

    # Read from the web guest's sshd, which runs from first boot. Pinned: no trust on first use.
    - name: Read the web guest's SSH host key
      ansible.builtin.slurp:
        src: /etc/ssh/ssh_host_ed25519_key.pub
      delegate_to: "{{ groups['bidsenseai_web'] | first }}"
      register: bidsenseai_extractor_web_host_key
      when: not ansible_check_mode

    - name: Pin the web guest's SSH host key
      ansible.builtin.copy:
        content: "{{ bidsenseai_extractor_web_host }} {{ (bidsenseai_extractor_web_host_key.content | b64decode).split(' ')[:2] | join(' ') }}\n"
        dest: "{{ bidsenseai_extractor_web_known_hosts }}"
        owner: "{{ bidsenseai_extractor_user }}"
        group: "{{ bidsenseai_extractor_user }}"
        mode: "0644"
      when: not ansible_check_mode

    - name: Install the systemd units
      ansible.builtin.template:
        src: "{{ item }}.j2"
        dest: "/etc/systemd/system/{{ item }}"
        owner: root
        group: root
        mode: "0644"
      loop:
        - bidsenseai-extractor.service
        - bidsenseai-extractor.timer
        - bidsenseai-extractor-alert@.service
        - bidsenseai-extractor-web.service
        - bidsenseai-extractor-web.timer
      notify:
        - Reload systemd
        - Restart extractor timer
        - Restart web timer

    - name: Remove the old non-template alert unit
      ansible.builtin.file:
        path: /etc/systemd/system/bidsenseai-extractor-alert.service
        state: absent
      notify: Reload systemd

    - name: Load the new units
      ansible.builtin.meta: flush_handlers

    # The units do not exist in check mode on a host that never had them.
    - name: Enable and start the timer
      ansible.builtin.systemd:
        name: bidsenseai-extractor.timer
        state: started
        enabled: true
      when: not ansible_check_mode

    - name: Enable and start the web timer
      ansible.builtin.systemd:
        name: bidsenseai-extractor-web.timer
        state: started
        enabled: true
      when: not ansible_check_mode

# The site moved to the bidsenseai_web guest. The units go first: the timer must not fire
# while its files are being removed.
- name: Look for the old site timer
  ansible.builtin.stat:
    path: /etc/systemd/system/bidsenseai-extractor-site.timer
  register: bidsenseai_extractor_old_site_timer

- name: Stop and disable the old site timer
  ansible.builtin.systemd:
    name: bidsenseai-extractor-site.timer
    state: stopped
    enabled: false
  when: bidsenseai_extractor_old_site_timer.stat.exists and not ansible_check_mode

- name: Remove the old site units
  ansible.builtin.file:
    path: "/etc/systemd/system/{{ item }}"
    state: absent
  loop:
    - bidsenseai-extractor-site.service
    - bidsenseai-extractor-site.timer
  notify: Reload systemd

# Purging also stops the service and removes /etc/nginx, including the old site config.
- name: Remove nginx
  ansible.builtin.apt:
    name:
      - nginx
      - nginx-common
    state: absent
    purge: true
    autoremove: true

- name: Remove the old site directory
  ansible.builtin.file:
    path: /srv/bidsenseai
    state: absent
