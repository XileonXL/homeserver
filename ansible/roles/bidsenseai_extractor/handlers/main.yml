---
- name: Reload systemd
  ansible.builtin.systemd:
    daemon_reload: true

# Skipped in check mode: the timer unit does not exist yet on a fresh host.
- name: Restart extractor timer
  ansible.builtin.systemd:
    name: bidsenseai-extractor.timer
    state: restarted
  when: not ansible_check_mode

# Skipped in check mode: the timer unit does not exist yet on a fresh host.
- name: Restart site timer
  ansible.builtin.systemd:
    name: bidsenseai-extractor-site.timer
    state: restarted
  when: not ansible_check_mode

# Skipped in check mode: nginx may not be installed yet.
- name: Reload nginx
  ansible.builtin.service:
    name: nginx
    state: reloaded
  when: not ansible_check_mode
