---
- name: Check whether Pi-hole is installed
  ansible.builtin.stat:
    path: "{{ pihole_binary }}"
  register: pihole_stat

- name: Fail on first install without a web password
  ansible.builtin.assert:
    that: pihole_web_password | length > 0
    fail_msg: >-
      Pi-hole is not installed yet and PIHOLE_WEB_PASSWORD is empty. Export it and
      run again.
    quiet: true
  # Check mode must work before the first install.
  when:
    - not pihole_stat.stat.exists
    - not ansible_check_mode

- name: Install installer prerequisites
  ansible.builtin.apt:
    name:
      - ca-certificates
      - curl
      - git
    state: present
    update_cache: true
    cache_valid_time: 3600

# There is no apt repository for Pi-hole. The installer is downloaded to a file
# (not piped into a shell) and left in place; it is only fetched when needed.
- name: Download the Pi-hole installer
  ansible.builtin.get_url:
    url: "{{ pihole_installer_url }}"
    dest: "{{ pihole_installer_path }}"
    owner: root
    group: root
    mode: "0700"
  when: not pihole_stat.stat.exists

# Without an existing pihole.toml the installer opens its dialogs even with
# --unattended, and waits forever when there is no terminal.
- name: Create the Pi-hole configuration directory
  ansible.builtin.file:
    path: /etc/pihole
    state: directory
    mode: "0755"
  when: not pihole_stat.stat.exists

- name: Seed pihole.toml so the installer runs unattended
  ansible.builtin.copy:
    dest: /etc/pihole/pihole.toml
    content: |
      [dns]
      upstreams = {{ pihole_upstream_dns | to_json }}
    mode: "0644"
    force: false
  when: not pihole_stat.stat.exists

- name: Install Pi-hole
  ansible.builtin.command:
    argv:
      - bash
      - "{{ pihole_installer_path }}"
      - --unattended
    creates: "{{ pihole_binary }}"
  # FTL can keep serving the empty gravity database it opened before the installer
  # filled it, and then blocks nothing until it is restarted.
  notify: Restart pihole-FTL

# Neither the FTL config nor the service exist before the install, so check mode
# stops here on a host without Pi-hole.
- name: Configure and run Pi-hole
  when: not ansible_check_mode or pihole_stat.stat.exists
  block:
    - name: Enable and start pihole-FTL
      ansible.builtin.service:
        name: pihole-FTL
        state: started
        enabled: true

    - name: Read the upstream DNS servers
      ansible.builtin.command: pihole-FTL --config dns.upstreams
      register: pihole_upstreams
      changed_when: false
      check_mode: false

    - name: Set the upstream DNS servers
      ansible.builtin.command:
        argv:
          - pihole-FTL
          - --config
          - dns.upstreams
          - "{{ pihole_upstream_dns | to_json }}"
      changed_when: true
      notify: Restart pihole-FTL
      # Tolerates both '["a","b"]' and '[ a, b ]' output.
      when: (pihole_upstreams.stdout | regex_findall('[^\s,\[\]"]+')) != pihole_upstream_dns

    - name: Read the listening mode
      ansible.builtin.command: pihole-FTL --config dns.listeningMode
      register: pihole_listening
      changed_when: false
      check_mode: false

    - name: Set the listening mode
      ansible.builtin.command:
        argv:
          - pihole-FTL
          - --config
          - dns.listeningMode
          - "{{ pihole_listening_mode }}"
      changed_when: true
      notify: Restart pihole-FTL
      when: pihole_listening.stdout | trim != pihole_listening_mode

    - name: Read the local DNS records
      ansible.builtin.command: pihole-FTL --config dns.hosts
      register: pihole_dns_hosts_current
      changed_when: false
      check_mode: false

    - name: Set the local DNS records
      ansible.builtin.command:
        argv:
          - pihole-FTL
          - --config
          - dns.hosts
          - "{{ pihole_dns_hosts_desired | to_json }}"
      changed_when: true
      notify: Restart pihole-FTL
      when: pihole_dns_hosts_parsed != pihole_dns_hosts_desired
      vars:
        pihole_dns_hosts_desired: >-
          {{ pihole_local_dns_records | map(attribute='ip')
             | zip(pihole_local_dns_records | map(attribute='name'))
             | map('join', ' ') | list }}
        # FTL prints the array as '[ a b, c d ]'.
        pihole_dns_hosts_parsed: >-
          {{ (pihole_dns_hosts_current.stdout | trim
              | regex_replace('^\[\s*', '') | regex_replace('\s*\]$', '')).split(',')
             | map('trim') | map('regex_replace', '^"|"$', '')
             | reject('equalto', '') | list }}

    - name: Read the web interface domain
      ansible.builtin.command: pihole-FTL --config webserver.domain
      register: pihole_web_domain_current
      changed_when: false
      check_mode: false
      when: pihole_web_domain | length > 0

    - name: Set the web interface domain
      ansible.builtin.command:
        argv:
          - pihole-FTL
          - --config
          - webserver.domain
          - "{{ pihole_web_domain }}"
      changed_when: true
      notify: Restart pihole-FTL
      when:
        - pihole_web_domain | length > 0
        - pihole_web_domain_current.stdout | trim != pihole_web_domain

    - name: Read the NTP sync setting
      ansible.builtin.command: pihole-FTL --config ntp.sync.active
      register: pihole_ntp_sync_current
      changed_when: false
      check_mode: false

    - name: Set the NTP sync setting
      ansible.builtin.command:
        argv:
          - pihole-FTL
          - --config
          - ntp.sync.active
          - "{{ pihole_ntp_sync | string | lower }}"
      changed_when: true
      notify: Restart pihole-FTL
      when: (pihole_ntp_sync_current.stdout | trim | lower) != (pihole_ntp_sync | string | lower)

    - name: Build the gravity database if it does not exist
      ansible.builtin.command:
        argv:
          - "{{ pihole_binary }}"
          - -g
        creates: "{{ pihole_gravity_db }}"

    - name: Read the configured blocklists
      ansible.builtin.command:
        argv:
          - pihole-FTL
          - sqlite3
          - "{{ pihole_gravity_db }}"
          - SELECT address FROM adlist;
      register: pihole_adlists_current
      changed_when: false
      check_mode: false

    - name: Add missing blocklists
      ansible.builtin.command:
        argv:
          - pihole-FTL
          - sqlite3
          - "{{ pihole_gravity_db }}"
          - >-
            INSERT INTO adlist (address, comment)
            VALUES ('{{ item | replace("'", "''") }}', 'Managed by Ansible');
      loop: "{{ pihole_adlists | difference(pihole_adlists_current.stdout_lines) }}"
      changed_when: true
      register: pihole_adlists_added

    # The installer can leave the blocklists subscribed but never downloaded, in
    # which case Pi-hole resolves everything and filters nothing.
    - name: Count the domains in gravity
      ansible.builtin.command:
        argv:
          - pihole-FTL
          - sqlite3
          - "{{ pihole_gravity_db }}"
          - SELECT COUNT(*) FROM gravity;
      register: pihole_gravity_count
      changed_when: false
      check_mode: false

    - name: Update gravity
      ansible.builtin.command:
        argv:
          - "{{ pihole_binary }}"
          - -g
      changed_when: true
      notify: Restart pihole-FTL
      when: >-
        pihole_adlists_added is changed
        or (pihole_gravity_count.stdout | trim | int) == 0

    # The value is hashed by FTL, so it cannot be compared; a non-empty variable
    # is always applied. It is visible in the container's process list while the
    # command runs.
    - name: Set the web admin password
      ansible.builtin.command:
        argv:
          - pihole-FTL
          - --config
          - webserver.api.password
          - "{{ pihole_web_password }}"
      changed_when: true
      no_log: true
      when: pihole_web_password | length > 0
